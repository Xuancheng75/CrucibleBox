[package]
name = "cruciblebox-repository"
version = "0.1.0"
edition = "2021"

[features]
default = []
test-fixtures = []

[dependencies]
cruciblebox-next-protocol = { path = "../next-protocol" }
base64 = "0.22"
sha2 = "0.10"
getrandom = "0.2"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
getrandom = "0.2"
tempfile = "=3.27.0"
