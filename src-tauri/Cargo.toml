[package]
name = "cruciblebox"
version = "2.1.0"
edition = "2021"
description = "CrucibleBox - extensible Windows toolbox (Tauri 2)"
authors = ["CrucibleBox"]
license = "AGPL-3.0-only"

[features]
default = []
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-updater = "2"
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cruciblebox-next2-protocol = { path = "crates/next2-protocol" }
cruciblebox-next2-runtime = { path = "crates/next2-runtime" }
cruciblebox-task-core = { path = "crates/task-core" }
cruciblebox-task-store = { path = "crates/task-store" }
cruciblebox-task-runtime = { path = "crates/task-runtime" }
cruciblebox-repository = { path = "crates/repository" }
cruciblebox-next-data = { path = "crates/next-data" }
getrandom = "0.2"
zip = { version = "2", default-features = false, features = ["deflate"] }
ureq = { version = "2", default-features = false, features = ["tls", "native-certs", "proxy-from-env", "socks-proxy"] }
sha2 = "0.10"
arboard = "3"
base64 = "0.22"
url = "2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
  "Win32_System_Com",
  "Win32_Networking_BackgroundIntelligentTransferService"
] }
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_System_Threading",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_ProcessStatus",
  "Win32_UI_WindowsAndMessaging",
  "Win32_System_Registry",
  "Win32_Graphics_Dwm",
  "Win32_Networking_WinHttp"
] }

[dev-dependencies]
cruciblebox-repository = { path = "crates/repository", features = ["test-fixtures"] }
tempfile = "=3.27.0"

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "unwind"
