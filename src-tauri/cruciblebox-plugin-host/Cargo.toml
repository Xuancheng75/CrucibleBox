[package]
name = "cruciblebox-plugin-host"
version = "2.1.0"
edition = "2021"
license = "AGPL-3.0-only"
description = "CrucibleBox plugin backend sidecar (quickjs-ng) - runs plugin backend CJS in an isolated process"

[dependencies]
cruciblebox-next2-protocol = { path = "../crates/next2-protocol" }
cruciblebox-next2-runtime = { path = "../crates/next2-runtime" }
rquickjs = { version = "0.12", features = ["futures"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
lto = true
codegen-units = 1
