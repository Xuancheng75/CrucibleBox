name: Windows CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: windows-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify Windows x64
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24.15.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Quality gates
        run: npm run check

      - name: Build host and plugins
        run: npm run build

      - name: Clean checkout gate (clean tree + LF line endings)
        run: npm run verify:clean-checkout

      - name: Audit dependency graph
        run: npm run audit:dependencies

      - name: Package and verify plugins
        run: npm run package:plugins && npm run verify:plugins

      - name: Generate CycloneDX SBOMs
        run: npm run generate:sbom

      - name: Package unpacked Windows application
        run: npm run package:dir

      - name: Verify Electron native runtime
        run: npm run smoke:native

      - name: Launch packaged Windows application
        run: npm run smoke:packaged

      - name: Upload supply-chain artifacts
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: cruciblebox-windows-supply-chain
          if-no-files-found: error
          path: |
            artifacts/plugins/
            artifacts/sbom/

  # 1.9.1: Rust/Tauri 线接入 CI（并行，独立于 Electron verify）。
  # 在 Electron 冻结/删除前先把 Rust 门禁跑进 CI；1.9.2 冻结时提升为唯一门禁。
  tauri-verify:
    name: Verify Tauri (Rust) x64
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24.15.0
          cache: npm
          cache-dependency-path: tauri-frontend/package-lock.json

      - name: Setup Rust (stable-msvc)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: src-tauri

      - name: Install frontend deps
        working-directory: tauri-frontend
        run: npm ci

      - name: Build frontend
        working-directory: tauri-frontend
        run: npm run build

      # externalBin 需在 Rust 门禁（tauri-build 校验）前就位
      - name: Build plugin host sidecar
        working-directory: src-tauri/cruciblebox-plugin-host
        run: cargo build --release

      - name: Stage plugin host sidecar
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p src-tauri/binaries
          cp src-tauri/cruciblebox-plugin-host/target/release/cruciblebox-plugin-host.exe \
            src-tauri/binaries/cruciblebox-plugin-host-x86_64-pc-windows-msvc.exe

      - name: Cargo fmt check
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Cargo clippy (deny warnings)
        working-directory: src-tauri
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Cargo test
        working-directory: src-tauri
        run: cargo test --workspace

      - name: Cargo build (main app)
        working-directory: src-tauri
        run: cargo build
