name: Windows CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: windows-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify Windows x64
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24.15.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Quality gates
        run: npm run check

      - name: Build host and plugins
        run: npm run build

      - name: Clean checkout gate (clean tree + LF line endings)
        run: npm run verify:clean-checkout

      - name: Audit dependency graph
        run: npm run audit:dependencies

      - name: Package and verify plugins
        run: npm run package:plugins && npm run verify:plugins

      - name: Generate CycloneDX SBOMs
        run: npm run generate:sbom

      - name: Package unpacked Windows application
        run: npm run package:dir

      - name: Verify Electron native runtime
        run: npm run smoke:native

      - name: Launch packaged Windows application
        run: npm run smoke:packaged

      - name: Upload supply-chain artifacts
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: cruciblebox-windows-supply-chain
          if-no-files-found: error
          path: |
            artifacts/plugins/
            artifacts/sbom/
