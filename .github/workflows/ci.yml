name: Windows CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: windows-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify Windows x64
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24.15.0
          cache: npm
      - run: npm install -g npm@11.12.1
      - run: npm ci --prefix tauri-frontend
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run build
  tauri-verify:
    name: Verify Tauri (Rust) x64
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24.15.0
          cache: npm
          cache-dependency-path: tauri-frontend/package-lock.json

      - name: Setup Rust (stable-msvc)
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master snapshot
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: src-tauri

      - name: Align npm with project packageManager
        run: npm install -g npm@11.12.1

      - name: Install frontend deps
        working-directory: tauri-frontend
        run: npm ci

      - name: Install platform build dependencies
        run: npm ci --ignore-scripts

      - name: Verify host and public SDK gates
        run: npm run check

      - name: Verify API 6 contract and SDK
        run: npm run test:next

      - name: Verify API 6 Rust protocol
        working-directory: src-tauri/crates/next2-protocol
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --check
          cargo clippy --all-targets --locked -- -D warnings
          cargo test --locked

      - name: Build frontend
        working-directory: tauri-frontend
        run: npm run build

      - name: Verify API 6 task core and journal
        shell: bash
        run: |
          set -euo pipefail
          for crate in task-core task-store file-publication task-runtime repository next-data next2-protocol; do
            cargo fmt --manifest-path "src-tauri/crates/$crate/Cargo.toml" --check
            cargo clippy --manifest-path "src-tauri/crates/$crate/Cargo.toml" --all-targets --locked -- -D warnings
            cargo test --manifest-path "src-tauri/crates/$crate/Cargo.toml" --locked
          done

      - name: Verify plugin host sidecar
        working-directory: src-tauri/cruciblebox-plugin-host
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --check
          cargo clippy --all-targets --locked -- -D warnings
          cargo test --locked

      - name: Build plugin host sidecar
        working-directory: src-tauri/cruciblebox-plugin-host
        run: cargo build --release --locked

      - name: Stage plugin host sidecar
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p src-tauri/binaries
          cp src-tauri/cruciblebox-plugin-host/target/release/cruciblebox-plugin-host.exe \
            src-tauri/binaries/cruciblebox-plugin-host-x86_64-pc-windows-msvc.exe
          mkdir -p src-tauri/target/debug
          cp src-tauri/cruciblebox-plugin-host/target/release/cruciblebox-plugin-host.exe \
            src-tauri/target/debug/cruciblebox-plugin-host.exe

      - name: Verify Tauri runtime assets
        run: node scripts/verify-tauri-runtime-assets.mjs --staged .

      - name: Cargo fmt check
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Cargo clippy (deny warnings)
        working-directory: src-tauri
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Cargo test
        working-directory: src-tauri
        run: cargo test --workspace --locked

      - name: Verify generic native plugin runtime
        working-directory: src-tauri/crates/next2-runtime
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --check
          cargo clippy --all-targets --features test-backend --locked -- -D warnings
          cargo test --features test-backend --locked

      - name: Cargo build (main app)
        working-directory: src-tauri
        run: cargo build --locked
