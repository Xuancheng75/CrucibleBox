name: Windows CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: windows-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify Windows x64
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24.15.0
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run build
      - run: npm run package:plugins:tauri
      - run: npm run verify:plugins:tauri

  tauri-verify:
    name: Verify Tauri (Rust) x64
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24.15.0
          cache: npm
          cache-dependency-path: tauri-frontend/package-lock.json

      - name: Setup Rust (stable-msvc)
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master snapshot
        with:
          toolchain: 1.92.0
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: src-tauri

      - name: Install frontend deps
        working-directory: tauri-frontend
        run: npm ci

      - name: Install root deps (frame runtime)
        run: npm ci --ignore-scripts

      - name: Fetch document runtime dependencies
        run: cargo fetch --locked --manifest-path workers/document/Cargo.toml

      - name: Build optional pinned document runtime
        run: npm run package:document-runtime -- --output artifacts/document-runtime --target-dir workers/document/target --pin-source shared/document-runtime-catalog.json

      - name: Verify document worker tests and process isolation
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path workers/document/Cargo.toml --check
          cargo clippy --manifest-path workers/document/Cargo.toml --all-targets --locked -- -D warnings
          cargo test --manifest-path workers/document/Cargo.toml --features acceptance-faults --locked

      - name: Measure controlled document worker performance
        shell: pwsh
        run: |
          $env:DOCUMENT_WORKER_PERF_RESULT = 'artifacts/document-runtime/performance.json'
          $env:DOCUMENT_WORKER_STRESS_RESULT = 'artifacts/document-runtime/stress-2000-pages.json'
          cargo test --release --manifest-path workers/document/Cargo.toml --test performance -- --ignored --nocapture --test-threads=1

      - name: Upload controlled document worker performance evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: document-worker-performance
          path: |
            artifacts/document-runtime/performance.json
            artifacts/document-runtime/stress-2000-pages.json
          if-no-files-found: error
          retention-days: 30

      - name: Verify application and plugin gates
        run: npm run check

      - name: Verify seven-plugin distribution metadata
        run: npm run package:plugins:tauri && npm run verify:plugins:tauri

      - name: Verify independently built official Next plugins
        run: npm run verify:next-independent

      - name: Verify frozen Next contract and SDK
        run: npm run test:next

      - name: Verify frozen Next Rust protocol
        working-directory: src-tauri/crates/next-protocol
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --check
          cargo clippy --all-targets --locked -- -D warnings
          cargo test --locked

      - name: Build frontend
        working-directory: tauri-frontend
        run: npm run build

      - name: Build plugin frame runtime
        run: npm run build:frame

      - name: Verify plugin frame runtime
        run: npm run verify:plugin-frame-runtime

      - name: Prepare bundled 7-Zip runtime
        run: npm run prepare:7zip

      # externalBin + resources 需在 Rust 门禁（tauri-build 校验）前就位
      - name: Verify frozen Next task core and journal
        shell: bash
        run: |
          set -euo pipefail
          for crate in task-core task-store file-publication task-runtime repository next-data; do
            cargo fmt --manifest-path "src-tauri/crates/$crate/Cargo.toml" --check
            cargo clippy --manifest-path "src-tauri/crates/$crate/Cargo.toml" --all-targets --locked -- -D warnings
            cargo test --manifest-path "src-tauri/crates/$crate/Cargo.toml" --locked
          done

      - name: Verify plugin host sidecar
        working-directory: src-tauri/cruciblebox-plugin-host
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --check
          cargo clippy --all-targets --locked -- -D warnings
          cargo test --locked

      - name: Build plugin host sidecar
        working-directory: src-tauri/cruciblebox-plugin-host
        run: cargo build --release --locked

      - name: Stage plugin host sidecar
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p src-tauri/binaries
          cp src-tauri/cruciblebox-plugin-host/target/release/cruciblebox-plugin-host.exe \
            src-tauri/binaries/cruciblebox-plugin-host-x86_64-pc-windows-msvc.exe
          mkdir -p src-tauri/target/debug
          cp src-tauri/cruciblebox-plugin-host/target/release/cruciblebox-plugin-host.exe \
            src-tauri/target/debug/cruciblebox-plugin-host.exe

      - name: Build OCR worker
        working-directory: ocr-worker
        run: cargo build --release --locked

      - name: Stage OCR worker sidecar
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p src-tauri/binaries
          cp ocr-worker/target/release/ocr-worker.exe \
            src-tauri/binaries/ocr-worker-x86_64-pc-windows-msvc.exe

      - name: Stage ONNX Runtime sidecar dependencies
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'onnxruntime-win-x64-1.28.1.zip'
          $url = 'https://sourceforge.net/projects/onnx-runtime.mirror/files/v1.28.1/onnxruntime-win-x64-1.28.1.zip/download?use_mirror=master'
          curl.exe --fail --location --retry 5 --retry-all-errors --retry-delay 2 --connect-timeout 20 --max-time 900 --output $archive $url
          $hash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne 'e46ac7652def5da0e5223372be21185ffff553e0419459f66e0114d460c38162') { throw "ONNX Runtime archive SHA-256 mismatch: $hash" }
          $extract = Join-Path $env:RUNNER_TEMP 'onnxruntime-1.28.1'
          Expand-Archive -LiteralPath $archive -DestinationPath $extract -Force
          New-Item -ItemType Directory -Path 'src-tauri/binaries' -Force | Out-Null
          Copy-Item -LiteralPath (Join-Path $extract 'onnxruntime-win-x64-1.28.1/lib/onnxruntime.dll') -Destination 'src-tauri/binaries/onnxruntime.dll' -Force
          Copy-Item -LiteralPath (Join-Path $extract 'onnxruntime-win-x64-1.28.1/lib/onnxruntime_providers_shared.dll') -Destination 'src-tauri/binaries/onnxruntime_providers_shared.dll' -Force

      - name: Verify Tauri runtime assets
        run: node scripts/verify-tauri-runtime-assets.mjs --staged .

      - name: Cargo fmt check
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Cargo clippy (deny warnings)
        working-directory: src-tauri
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Cargo test
        working-directory: src-tauri
        run: cargo test --workspace --locked

      - name: Verify separately packaged document runtime installation and restart
        shell: pwsh
        run: |
          $env:DOCUMENT_RUNTIME_ACCEPTANCE_DIRECTORY = (Resolve-Path 'artifacts/document-runtime/0.1.0').Path
          cargo test --manifest-path src-tauri/Cargo.toml pinned_document_runtime_installs_and_runs_without_ocr_resources -- --ignored --nocapture

      - name: Verify durable document PDF publication, cancellation, failure and restart
        shell: pwsh
        run: |
          $runtime = (Resolve-Path 'artifacts/document-runtime/0.1.0').Path
          $env:DOCUMENT_WORKER_ACCEPTANCE_EXE = Join-Path $runtime 'document-worker.exe'
          $env:DOCUMENT_WORKER_ACCEPTANCE_PDFIUM = Join-Path $runtime 'pdfium.dll'
          cargo test --manifest-path src-tauri/Cargo.toml parse_pdf_task_returns_unified_document -- --ignored --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --manifest-path src-tauri/Cargo.toml convert_task_writes_markdown_output -- --ignored --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --manifest-path src-tauri/Cargo.toml native_document_artifacts_publish_durably_and_survive_restart -- --ignored --nocapture

      - name: Cargo build (main app)
        working-directory: src-tauri
        run: cargo build --locked

      - name: Verify seven official plugin upgrade and reinstall retention
        working-directory: src-tauri
        run: cargo test --locked seven_official_packages_preserve_data_and_files -- --ignored --nocapture
