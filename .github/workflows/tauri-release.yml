name: Tauri Release (v1.8.4+)

# 1.8.4 引入的 Tauri 发布链（与 Electron release.yml 的 v* 链并存、互不干扰）。
# 触发：tauri-v* tag（首个 Tauri 正式版 v1.8.4 即 tauri-v1.8.4）。
# 产物：NSIS 安装器 + updater 签名 JSON（latest.json）+ SBOM + attestation。
# 签名：TAURI_SIGNING_PRIVATE_KEY（GitHub secret，minisign 私钥）——发布前必须配置。
#
# oracle 审查修复（1.8.4）：C1 tauri-cli 安装、C2 根 npm ci、C3 frontendDist→dist、
# H1 tag↔版本一致性、H2 私钥自检说明、H3 产物 smoke 门禁、M2 SBOM 落地、M4 action
# SHA pin、M5 dispatch tag 校验。

on:
  push:
    tags:
      - 'tauri-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tauri-v* tag to publish (format tauri-vX.Y.Z)
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: tauri-release-${{ github.event.inputs.tag || github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  tauri-release:
    name: Build and publish Tauri Windows x64
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24.15.0
          cache: npm
          cache-dependency-path: tauri-frontend/package-lock.json

      - name: Setup Rust (stable-msvc)
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master snapshot
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: src-tauri

      # C2: tauri-frontend 依赖（Tauri 前端独立 lockfile）
      - name: Install frontend deps
        working-directory: tauri-frontend
        run: npm ci

      # 根依赖仅用于 build:frame（out/plugin-frame/runtime.js，协议硬依赖）
      - name: Install root deps (frame runtime)
        run: npm ci --ignore-scripts

      - name: Build plugin frame runtime
        run: npm run build:frame

      # externalBin + resources 需在 Rust 门禁（tauri-build 校验）前就位
      - name: Build plugin host sidecar
        working-directory: src-tauri/cruciblebox-plugin-host
        run: cargo build --release

      - name: Stage plugin host sidecar
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p src-tauri/binaries
          cp src-tauri/cruciblebox-plugin-host/target/release/cruciblebox-plugin-host.exe \
            src-tauri/binaries/cruciblebox-plugin-host-x86_64-pc-windows-msvc.exe

      - name: Build OCR worker
        working-directory: ocr-worker
        run: cargo build --release

      - name: Stage OCR worker sidecar
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p src-tauri/binaries
          cp ocr-worker/target/release/ocr-worker.exe \
            src-tauri/binaries/ocr-worker-x86_64-pc-windows-msvc.exe

      - name: Verify Tauri runtime assets
        run: node scripts/verify-tauri-runtime-assets.mjs --staged .

      # M2 (1.9.1): Tauri 原生门禁替代 Electron 链的 npm run check
      - name: Cargo fmt check
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Cargo clippy (deny warnings)
        working-directory: src-tauri
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Cargo test (workspace)
        working-directory: src-tauri
        run: cargo test --workspace

      - name: Build frontend
        working-directory: tauri-frontend
        run: npm run build

      # H1: tag ↔ src-tauri 版本一致性 + dispatch tag 格式校验（M5）
      - name: Resolve and validate release tag
        id: release
        shell: bash
        run: |
          TAG="${INPUT_TAG:-${GITHUB_REF#refs/tags/}}"
          if ! [[ "$TAG" =~ ^tauri-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::invalid tag format (expected tauri-vX.Y.Z): $TAG"
            exit 1
          fi
          CONF_VERSION="$(node -e "console.log(require('./src-tauri/tauri.conf.json').version)")"
          if [ "$TAG" != "tauri-v${CONF_VERSION}" ]; then
            echo "::error::tag ${TAG} does not match tauri.conf.json version ${CONF_VERSION}"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#tauri-v}" >> "$GITHUB_OUTPUT"
          case "$TAG" in
            *-beta.*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}

      # C1: 安装与核心 crate 对齐版本的 tauri-cli
      - name: Install tauri-cli (aligned)
        working-directory: src-tauri
        shell: bash
        run: |
          CORE_VERSION="$(grep '^tauri = ' Cargo.toml | sed -E 's/.*"([0-9.]+)".*/\1/')"
          cargo install tauri-cli --locked --version "^${CORE_VERSION}" || \
            cargo install tauri-cli --locked

      # 1.9.9: 强制重建 exe 图标资源。Swatinem/rust-cache 会缓存 target，而 tauri-build
      # 未对 icons/*.ico 发 rerun-if-changed，cargo 复用缓存的 .res 资源 → 打包旧图标。
      # 删除本 crate 的 build 输出目录强制 tauri-build 重跑并重新嵌入 window icon。
      # 1.9.11: 清理必须可证明——一个目录都没删到说明缓存布局变了（crate 改名等），
      # 守卫静默失效，直接失败；同时清 .fingerprint 防止输出缺失被误判为最新。
      - name: Force rebuild of app icon resources
        working-directory: src-tauri
        shell: bash
        run: |
          set -euo pipefail
          REMOVED=0
          for d in target/release/build/cruciblebox-* target/debug/build/cruciblebox-*; do
            if [ -d "$d" ]; then rm -rf "$d"; REMOVED=$((REMOVED+1)); fi
          done
          for d in target/release/.fingerprint/cruciblebox-* target/debug/.fingerprint/cruciblebox-*; do
            if [ -d "$d" ]; then rm -rf "$d"; fi
          done
          if [ "$REMOVED" -eq 0 ]; then
            echo "::error::icon cache guard matched zero cruciblebox build dirs - cache layout changed, guard must be updated"
            exit 1
          fi
          echo "cleared ${REMOVED} cruciblebox build output dir(s) for icon resource regeneration"

      # 1.9.13：打包官方插件 zip（unienv/diary），随 release 附带供已装用户
      # 导入升级（NSIS 不更新 %APPDATA% 内的插件）。build:plugins 同时重跑
      # renderer 自包含与 trusted digest 校验。
      - name: Package official plugin bundles
        run: |
          npm run build:plugins
          npm run package:plugins

      - name: Build Tauri app + updater artifacts
        working-directory: src-tauri
        shell: bash
        run: |
          ls ../tauri-frontend/dist/index.html
          cargo tauri build --bundles nsis
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''

      # 1.9.11 (Bug A 守卫)：解包 setup.exe，断言内嵌应用 exe 已包含新图标像素数据。
      # 此前只验证安装器外壳图标，用户看到的是安装后的应用 exe / 快捷方式图标（机制不同），
      # cargo 缓存回归曾全绿通过。字节级存在性判据见 scripts/verify-tauri-icon.mjs。
      - name: Verify embedded app icon
        shell: bash
        run: |
          set -euo pipefail
          NSIS_DIR=src-tauri/target/release/bundle/nsis
          SETUP="$(find "$NSIS_DIR" -name '*-setup.exe' | head -1)"
          EXTRACT_DIR="$(mktemp -d)"
          SEVENZIP="/c/Program Files/7-Zip/7z.exe"
          if [ ! -f "$SEVENZIP" ]; then
            echo "::error::7-Zip not found at $SEVENZIP"
            exit 1
          fi
          "$SEVENZIP" x -y -o"$EXTRACT_DIR" "$SETUP" > /dev/null
          # 应用 exe = 解包产物中体积最大的 .exe（NSIS 外壳本身不在其中）
          APP_EXE="$(find "$EXTRACT_DIR" -name '*.exe' -printf '%s %p\n' | sort -rn | head -1 | cut -d' ' -f2-)"
          if [ -z "$APP_EXE" ]; then
            echo "::error::no exe found inside installer"
            exit 1
          fi
          echo "verifying embedded icon of: $APP_EXE"
          node scripts/verify-tauri-icon.mjs --icon src-tauri/icons/icon.ico --exe "$APP_EXE"

      # H3: 产物 smoke 门禁（installer 唯一 + .sig 存在 + 零证书断言）
      # 注（lib-1）：tauri-cli/bundler 从不生成 latest.json（只产 setup.exe + .sig）；
      # updater 清单在此组装。URL 用固定 tag 下载形式（避免 releases/latest 随 Electron
      # 发布漂移）。
      - name: Verify Tauri artifacts + build updater manifest
        shell: bash
        run: |
          set -euo pipefail
          NSIS_DIR=src-tauri/target/release/bundle/nsis
          SETUPS="$(find "$NSIS_DIR" -name '*-setup.exe' | wc -l)"
          if [ "$SETUPS" -ne 1 ]; then
            echo "::error::expected exactly 1 *-setup.exe, found ${SETUPS}"
            exit 1
          fi
          EXE="$(find "$NSIS_DIR" -name '*-setup.exe' | head -1)"
          SIG_FILE="${EXE}.sig"
          if [ ! -f "$SIG_FILE" ]; then
            echo "::error::signature file not found: ${SIG_FILE}"
            exit 1
          fi
          # 零证书策略：Authenticode 必须 NotSigned（与 Electron 链一致）
          SIG="$(powershell -Command "Get-AuthenticodeSignature -FilePath '$EXE' | Select-Object -ExpandProperty Status")"
          if [ "$SIG" != "NotSigned" ]; then
            echo "::error::expected NotSigned (zero-cert policy), got ${SIG}"
            exit 1
          fi
          # 组装 updater 清单（latest.json）：signature = .sig 全文，url = 固定 tag 下载
          TAG="${{ steps.release.outputs.tag }}"
          EXE_NAME="$(basename "$EXE")"
          node -e "
            const fs = require('fs');
            const sig = fs.readFileSync('$SIG_FILE', 'utf8').trim();
            if (!sig) { console.error('empty signature'); process.exit(1); }
            const manifest = {
              version: '${{ steps.release.outputs.tag }}'.replace(/^tauri-v/, ''),
              notes: 'CrucibleBox ${{ steps.release.outputs.tag }}',
              pub_date: new Date().toISOString(),
              platforms: {
                'windows-x86_64': {
                  signature: sig,
                  url: 'https://github.com/Xuancheng75/CrucibleBox/releases/download/${{ steps.release.outputs.tag }}/$EXE_NAME'
                }
              }
            };
            fs.writeFileSync('$NSIS_DIR/latest.json', JSON.stringify(manifest, null, 2));
            console.log('latest.json assembled, signature', sig.length, 'chars');
          "
          echo "artifact verification passed"

      # M2: SBOM 作为硬门禁生成并落地（不吞错）
      # 注（lib-2）：cargo-cyclonedx v0.5.x 无 --output-dir/-o 参数——在 crate 根
      # `-f json` 生成 `<crate>.cdx.json`（此处 cruciblebox.cdx.json）后移动到 sbom 目录。
      - name: Generate Rust SBOM (cargo-cyclonedx)
        working-directory: src-tauri
        shell: bash
        run: |
          cargo install cargo-cyclonedx --locked --version ^0.5 || cargo install cargo-cyclonedx --locked
          mkdir -p ../artifacts/sbom
          cargo cyclonedx -f json
          mv cruciblebox.cdx.json ../artifacts/sbom/
          cd cruciblebox-plugin-host
          cargo cyclonedx -f json
          mv cruciblebox-plugin-host.cdx.json ../../artifacts/sbom/

      - name: Collect Tauri artifacts + SBOM
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/tauri
          cp src-tauri/target/release/bundle/nsis/*-setup.exe artifacts/tauri/
          cp src-tauri/target/release/bundle/nsis/latest.json artifacts/tauri/
          cp src-tauri/target/release/bundle/nsis/*.sig artifacts/tauri/ 2>/dev/null || true
          cp artifacts/sbom/*.cdx.json artifacts/tauri/
          # 1.9.13：官方插件包随 release 附带（供已装用户导入升级）
          cp artifacts/plugins/*.zip artifacts/tauri/
          ls -la artifacts/tauri/

      - name: Attest artifacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: artifacts/tauri/*
          # 注：不指定 predicate-type 时 actions/attest 用默认 SLSA provenance；
          # 指定非默认 predicate-type 必须同时提供 predicate/predicate-path（见 1.9.2 修复）。
          push-to-registry: false

      - name: Publish GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: CrucibleBox-v${{ steps.release.outputs.version }}
          files: artifacts/tauri/*
          prerelease: ${{ steps.release.outputs.prerelease }}
          overwrite_files: true
          fail_on_unmatched_files: true

      # 1.9.7: 滚动更新清单同步到固定 tag（tauri-latest）。客户端 tauri.conf.json
      # endpoint 指向 tauri-latest/latest.json；此处把本次 latest.json 覆盖上去，
      # 让任何已安装版本的 app 都能读到最新 version（version = 本次 tag）。
      # 仅上传 latest.json（version 指向本次），setup.exe/.sig 仍留在各自 tauri-v* release。
      # tauri-latest 不匹配 v* / tauri-v* 触发模式，不会误触发其他发布链。
      - name: Sync rolling updater manifest (tauri-latest)
        shell: bash
        run: |
          set -euo pipefail
          gh release create tauri-latest \
            --repo "$GITHUB_REPOSITORY" \
            --latest=false \
            --title "CrucibleBox rolling updater manifest" \
            --notes "Rolling updater manifest for the CrucibleBox Tauri client." \
            artifacts/tauri/latest.json 2>/dev/null || \
          gh release upload tauri-latest \
            --repo "$GITHUB_REPOSITORY" \
            --clobber \
            artifacts/tauri/latest.json
          echo "synced latest.json to tauri-latest (version=${{ steps.release.outputs.version }})"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
