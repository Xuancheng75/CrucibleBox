name: Approved signed updater transition

# Manual only. The project prohibits installer tests on the user's machine.
# Dispatch only after the user approves this disposable-runner exception.
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Signed release draft to test (tauri-v2.2.0)
        required: true
        type: string
      retained_plugin_artifact:
        description: Existing public 2.1.1 API 6 JavaScript plugin ZIP for data preservation
        required: true
        type: string
      installer_test_approved:
        description: Explicit user approval for installer tests on this disposable VM
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  transition:
    if: ${{ inputs.installer_test_approved }}
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CRUCIBLEBOX_INSTALLER_TEST_APPROVED: 'true'
      CRUCIBLEBOX_UPDATER_TEST_PLUGIN_ARTIFACT: ${{ inputs.retained_plugin_artifact }}
      CARGO_TARGET_DIR: ${{ github.workspace }}/.workbench/updater-transition-target
      TEMP: ${{ github.workspace }}/.workbench/temp
      TMP: ${{ github.workspace }}/.workbench/temp
      TMPDIR: ${{ github.workspace }}/.workbench/temp
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
      - name: Prepare isolated test paths
        shell: pwsh
        run: New-Item -ItemType Directory -Force .workbench/temp, .workbench/updater-transition/old, .workbench/updater-transition/new | Out-Null
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24.15.0
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - name: Download fixed release inputs
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ($env:RELEASE_TAG -ne "tauri-v$version") { throw 'Release tag differs from checked-out source' }
          if ($env:CRUCIBLEBOX_UPDATER_TEST_PLUGIN_ARTIFACT -notmatch '^[a-z0-9][a-z0-9._-]*\.zip$') { throw 'Expected a public ZIP asset filename' }
          gh release download tauri-v2.1.1 --pattern 'CrucibleBox_2.1.1_x64-setup.exe' --pattern $env:CRUCIBLEBOX_UPDATER_TEST_PLUGIN_ARTIFACT --pattern 'SHA256SUMS.txt' --dir .workbench/updater-transition/old
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          gh release download $env:RELEASE_TAG --pattern '*-setup.exe' --pattern '*-setup.exe.sig' --pattern '*win-x64-portable.zip' --dir .workbench/updater-transition/new
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Expand-Archive ".workbench/updater-transition/new/CrucibleBox_${version}_win-x64-portable.zip" .workbench/updater-transition/new/portable
      - name: Build unshipped production-updater harness
        shell: pwsh
        run: |
          cargo fmt --manifest-path scripts/updater-transition/Cargo.toml --check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo clippy --manifest-path scripts/updater-transition/Cargo.toml --locked -- -D warnings
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo build --manifest-path scripts/updater-transition/Cargo.toml --locked
          exit $LASTEXITCODE
      - name: Verify signature rejection and actual installed-version switch
        run: node scripts/updater-transition/run.mjs
      - name: Save actual transition evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: signed-updater-transition
          path: .workbench/updater-transition/*.json
          if-no-files-found: error
