[package]
name = "cruciblebox-document-worker"
version = "0.1.0"
edition = "2021"

[features]
default = ["worker"]
worker = ["dep:cruciblebox-document-native"]
acceptance-faults = []

[[bin]]
name = "document-worker"
path = "src/main.rs"
required-features = ["worker"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
getrandom = "0.2"
cruciblebox-document-native = { path = "../../src-tauri/crates/document-native", optional = true }

[dev-dependencies]
tempfile = "=3.27.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_Security", "Win32_System_Threading"] }
