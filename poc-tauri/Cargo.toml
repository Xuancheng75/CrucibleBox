[package]
name = "poc-tauri-iframe"
version = "0.1.0"
edition = "2021"
description = "PoC: sandboxed iframe + custom protocol + MessagePort RPC on Tauri 2 / WebView2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
